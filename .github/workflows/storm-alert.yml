name: Storm alert

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes, off the busy :00/:30 marks (GitHub may still run late)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test ping to the owner's private topic"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: storm-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for storms across South Africa
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          OWNER_TOWN: "durban"
          APP_URL: "https://ondimptyltd.github.io/storm-radar/"
          TEST: ${{ inputs.test || 'false' }}
        run: python storm_alert.py
      - name: Save alert state
        run: |
          git config user.name "storm-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ alerts/ || true
          git diff --cached --quiet || (git commit -m "Storm alert sent" && git push)

name: Storm alert

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may run a few minutes late)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test ping"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: storm-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for storms
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LAT: "-29.87"
          LON: "30.89"
          PLACE: "Queensburgh"
          APP_URL: "https://ondimptyltd.github.io/storm-radar/"
          TEST: ${{ inputs.test || 'false' }}
        run: python storm_alert.py
      - name: Save alert state
        run: |
          git config user.name "storm-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet || (git commit -m "Storm alert sent" && git push)
